[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastwispr"
version = "0.1.0"
description = "Open-source local-first Windows dictation (Wispr Flow alternative). Hotkey, on-device Whisper, paste into any app."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Rodrigo Oliveira", email = "devv.rodrigo@gmail.com" }]
keywords = ["dictation", "whisper", "speech-to-text", "windows", "local-first", "privacy", "wispr-flow"]
dependencies = []

[project.urls]
Homepage = "https://github.com/rodrigo-devv/fastwispr"
Repository = "https://github.com/rodrigo-devv/fastwispr"

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
windows = ["keyboard>=0.13", "sounddevice>=0.4", "pyperclip>=1.8", "pyautogui>=0.9", "pystray>=0.19"]
packaging = ["pyinstaller>=6"]
test = ["pytest>=8"]

[project.scripts]
fastwispr = "fastwispr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
